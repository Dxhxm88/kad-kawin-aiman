<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>RSVP List</title>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    body { font-family: Jost, system-ui, sans-serif; background: #f6f1e7; color: #3d3a34; margin: 0; padding: 24px 16px; }
    .wrap { max-width: 960px; margin: 0 auto; }
    h1 { font-weight: 500; margin: 0 0 16px; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .stat { background: #fffdf8; border: 1px solid #e6dccb; border-radius: 12px; padding: 14px; }
    .stat b { display: block; font-size: 28px; font-weight: 500; color: #8f6f3e; }
    .bar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
    input, select, button { font: inherit; padding: 8px 12px; border: 1px solid #e6dccb; border-radius: 10px; background: #fffdf8; }
    button { background: #b08d57; color: #fff; border-color: #b08d57; cursor: pointer; }
    .table { overflow-x: auto; background: #fffdf8; border: 1px solid #e6dccb; border-radius: 12px; }
    table { border-collapse: collapse; width: 100%; font-size: 14px; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #efe7d9; vertical-align: top; }
    th { background: #f3ecdf; font-weight: 500; white-space: nowrap; }
    .yes { color: #4f7a52; } .no { color: #a5483f; }
    .gate { max-width: 320px; margin: 12vh auto 0; text-align: center; background: #fffdf8; border: 1px solid #e6dccb; border-radius: 16px; padding: 28px 22px; }
    .gate h1 { font-size: 22px; }
    .gate form { display: grid; gap: 10px; }
    .gate input { text-align: center; font-size: 20px; letter-spacing: .2em; }
    .gate .err { color: #a5483f; min-height: 1.2em; margin: 4px 0 0; font-size: 14px; }
    .top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
    .top h1 { margin: 0; }
    .ghost { background: none; color: #8f6f3e; border-color: #e6dccb; }
    [hidden] { display: none !important; }
  </style>
  <script src="config.js"></script>
</head>
<body>
  <div class="gate" id="gate">
    <h1>RSVP List</h1>
    <form id="pinForm">
      <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN" required />
      <button type="submit" id="pinBtn">Open</button>
    </form>
    <p class="err" id="pinErr" role="alert"></p>
  </div>

  <div class="wrap" id="app" hidden>
    <div class="top">
      <h1>RSVP List</h1>
      <span>
        <button class="ghost" id="refresh">Refresh</button>
        <button class="ghost" id="lock">Lock</button>
      </span>
    </div>
    <div class="stats">
      <div class="stat"><b id="sResp">0</b>Responses</div>
      <div class="stat"><b id="sYes">0</b>Attending</div>
      <div class="stat"><b id="sPax">0</b>Total guests</div>
      <div class="stat"><b id="sNo">0</b>Not attending</div>
    </div>
    <div class="bar">
      <input id="search" placeholder="Search name…" />
      <select id="filter">
        <option value="all">All</option>
        <option value="yes">Attending</option>
        <option value="no">Not attending</option>
      </select>
      <button id="csv">Download CSV</button>
    </div>
    <div class="table">
      <table>
        <thead><tr><th>#</th><th>Name</th><th>Attending</th><th>Pax</th><th>Wish</th><th>Time</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>

  <script type="module">
    import { fetchAll } from "./db.js";
    const $ = (s) => document.querySelector(s);
    let all = [];
    let pin = "";
    let timer;

    const fmt = (ms) => new Date(ms).toLocaleString();
    function render() {
      const q = $("#search").value.toLowerCase();
      const f = $("#filter").value;
      const list = all.filter((r) =>
        r.name.toLowerCase().includes(q) &&
        (f === "all" || (f === "yes") === r.attending));
      const tb = $("#rows");
      tb.innerHTML = "";
      list.forEach((r, i) => {
        const tr = document.createElement("tr");
        [i + 1, r.name, r.attending ? "Yes" : "No", r.pax, r.wish || "", fmt(r.createdAt)].forEach((v, j) => {
          const td = document.createElement("td");
          td.textContent = v;
          if (j === 2) td.className = r.attending ? "yes" : "no";
          tr.append(td);
        });
        tb.append(tr);
      });
    }

    function show(list) {
      all = list;
      const yes = list.filter((r) => r.attending);
      $("#sResp").textContent = list.length;
      $("#sYes").textContent = yes.length;
      $("#sPax").textContent = yes.reduce((a, r) => a + (Number(r.pax) || 0), 0);
      $("#sNo").textContent = list.length - yes.length;
      render();
    }

    /* ---------- PIN gate (the PIN is checked by the server, not in this page) ---------- */
    async function unlock(p) {
      $("#pinBtn").disabled = true;
      $("#pinErr").textContent = "";
      try {
        show(await fetchAll(p));
        pin = p;
        try { sessionStorage.setItem("admin_pin", p); } catch {}
        $("#gate").hidden = true;
        $("#app").hidden = false;
        clearInterval(timer);
        timer = setInterval(() => { if (!document.hidden) reload(); }, 30000);
      } catch (err) {
        try { sessionStorage.removeItem("admin_pin"); } catch {}
        $("#pinErr").textContent = err.status === 401 ? "Wrong PIN." : err.message;
        $("#pin").select();
      } finally {
        $("#pinBtn").disabled = false;
      }
    }
    async function reload() {
      try { show(await fetchAll(pin)); } catch (err) { if (err.status === 401) lock(); }
    }
    function lock() {
      pin = ""; all = []; render();
      clearInterval(timer);
      try { sessionStorage.removeItem("admin_pin"); } catch {}
      $("#app").hidden = true;
      $("#gate").hidden = false;
      $("#pin").value = "";
      $("#pin").focus();
    }

    $("#pinForm").addEventListener("submit", (e) => { e.preventDefault(); unlock($("#pin").value.trim()); });
    $("#refresh").addEventListener("click", reload);
    $("#lock").addEventListener("click", lock);
    let saved = null;
    try { saved = sessionStorage.getItem("admin_pin"); } catch {}
    if (saved) unlock(saved); else $("#pin").focus();

    $("#search").addEventListener("input", render);
    $("#filter").addEventListener("change", render);
    $("#csv").addEventListener("click", () => {
      const esc = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
      const lines = [["Name", "Attending", "Pax", "Wish", "Time"].join(",")]
        .concat(all.map((r) => [r.name, r.attending ? "Yes" : "No", r.pax, r.wish, fmt(r.createdAt)].map(esc).join(",")));
      const blob = new Blob(["﻿" + lines.join("\n")], { type: "text/csv" });
      const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(blob), download: "rsvp.csv" });
      a.click();
    });
  </script>
</body>
</html>
