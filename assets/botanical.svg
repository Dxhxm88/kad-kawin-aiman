<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" fill="none" stroke="#9c8a6a" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">
  <!-- long branch sweeping from the corner -->
  <path d="M0 40 C70 50 130 90 170 150 C200 195 215 250 214 320"/>
  <path d="M0 110 C50 112 92 130 118 160"/>
  <path d="M40 0 C55 40 80 70 120 92"/>

  <!-- leaves on the main branch -->
  <g fill="#c9d3bf" fill-opacity=".55">
    <path d="M40 48 q10 -22 34 -20 q-8 22 -34 20z"/>
    <path d="M70 60 q-4 24 14 38 q8 -24 -14 -38z"/>
    <path d="M100 74 q16 -18 40 -10 q-14 18 -40 10z"/>
    <path d="M128 100 q-2 26 18 36 q4 -24 -18 -36z"/>
    <path d="M152 126 q20 -12 40 2 q-20 12 -40 -2z"/>
    <path d="M168 160 q-6 24 10 40 q8 -22 -10 -40z"/>
    <path d="M186 186 q22 -6 36 12 q-22 6 -36 -12z"/>
    <path d="M200 228 q-10 20 2 40 q12 -18 -2 -40z"/>
    <path d="M208 262 q20 0 30 18 q-20 2 -30 -18z"/>
    <!-- side branches -->
    <path d="M36 112 q8 -18 28 -16 q-8 18 -28 16z"/>
    <path d="M70 122 q-2 20 14 30 q4 -20 -14 -30z"/>
    <path d="M92 132 q14 -12 32 -4 q-14 12 -32 4z"/>
    <path d="M54 28 q-20 -2 -26 -20 q20 0 26 20z"/>
    <path d="M70 52 q14 -16 34 -10 q-12 16 -34 10z"/>
  </g>

  <!-- blossoms -->
  <g fill="#f2d4cf" fill-opacity=".85" stroke="#d8a8a2" stroke-width=".8">
    <g transform="translate(120 92)">
      <ellipse cx="0" cy="-10" rx="6" ry="10"/>
      <ellipse cx="0" cy="-10" rx="6" ry="10" transform="rotate(72)"/>
      <ellipse cx="0" cy="-10" rx="6" ry="10" transform="rotate(144)"/>
      <ellipse cx="0" cy="-10" rx="6" ry="10" transform="rotate(216)"/>
      <ellipse cx="0" cy="-10" rx="6" ry="10" transform="rotate(288)"/>
      <circle r="3.5" fill="#d8b67a" stroke="none"/>
    </g>
    <g transform="translate(118 160) scale(.7)">
      <ellipse cx="0" cy="-10" rx="6" ry="10"/>
      <ellipse cx="0" cy="-10" rx="6" ry="10" transform="rotate(72)"/>
      <ellipse cx="0" cy="-10" rx="6" ry="10" transform="rotate(144)"/>
      <ellipse cx="0" cy="-10" rx="6" ry="10" transform="rotate(216)"/>
      <ellipse cx="0" cy="-10" rx="6" ry="10" transform="rotate(288)"/>
      <circle r="3.5" fill="#d8b67a" stroke="none"/>
    </g>
    <g transform="translate(214 320) scale(.85)">
      <ellipse cx="0" cy="-10" rx="6" ry="10" transform="rotate(-36)"/>
      <ellipse cx="0" cy="-10" rx="6" ry="10" transform="rotate(36)"/>
      <ellipse cx="0" cy="-10" rx="6" ry="10" transform="rotate(-90)"/>
      <ellipse cx="0" cy="-10" rx="6" ry="10" transform="rotate(90)"/>
    </g>
  </g>

  <!-- buds & dots -->
  <g fill="#d8b67a" stroke="none">
    <circle cx="0" cy="40" r="2.5"/>
    <circle cx="40" cy="0" r="2.5"/>
    <circle cx="170" cy="150" r="2"/>
    <circle cx="150" cy="60" r="1.6"/>
    <circle cx="200" cy="110" r="1.4"/>
    <circle cx="240" cy="170" r="1.2"/>
  </g>
</svg>
