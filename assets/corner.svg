<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 90" fill="none" stroke="#4f3520" stroke-width="1" stroke-linecap="round">
  <!-- main stem hugging the top-left corner -->
  <path d="M8 84 C8 40 30 10 84 8"/>
  <path d="M14 66 C16 40 34 18 62 14" stroke-opacity=".5"/>
  <!-- leaves -->
  <g fill="#4f3520" fill-opacity=".28">
    <path d="M9 62 q-8 -6 -4 -16 q8 6 4 16z"/>
    <path d="M12 46 q9 -4 13 -13 q-10 1 -13 13z"/>
    <path d="M20 30 q-7 -8 -1 -17 q6 8 1 17z"/>
    <path d="M32 19 q8 4 17 0 q-8 -7 -17 0z"/>
    <path d="M47 11 q4 -8 14 -9 q-3 9 -14 9z"/>
    <path d="M64 9 q8 3 15 -2 q-8 -5 -15 2z"/>
  </g>
  <!-- buds -->
  <g fill="#7a5638" stroke="none">
    <circle cx="84" cy="8" r="2.2"/>
    <circle cx="8" cy="84" r="2.2"/>
    <circle cx="62" cy="14" r="1.5"/>
    <circle cx="14" cy="66" r="1.5"/>
  </g>
  <!-- tiny blossom in the corner -->
  <g transform="translate(24 24)" fill="#e8d3b2" stroke="#4f3520" stroke-width=".6">
    <circle cx="0" cy="-5" r="3.4"/>
    <circle cx="4.8" cy="-1.5" r="3.4"/>
    <circle cx="3" cy="4" r="3.4"/>
    <circle cx="-3" cy="4" r="3.4"/>
    <circle cx="-4.8" cy="-1.5" r="3.4"/>
    <circle cx="0" cy="0" r="1.8" fill="#7a5638" stroke="none"/>
  </g>
</svg>
